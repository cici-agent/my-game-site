<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0a2a">
<link rel="manifest" href="/manifest.json">
<title>小菜鸟宇宙</title>
<link rel="stylesheet" href="css/space.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }
</script>
</head>
<body class="flying">
<div id="bg"></div>
<canvas id="scene"></canvas>
<canvas id="warp"></canvas>
<div id="flash"></div>

<div class="hud-top">
  <div class="brand"><div class="dot">🐣</div>小菜鸟宇宙<span class="where" id="where"></span><button id="mute" title="声音">🔊</button></div>
  <div class="coin-hud">🪙 : <span id="coinNum">--</span></div>
</div>
<div class="hint" id="hint">开到星球附近会自动穿过星门降落 · 方向键 / WASD 驾驶 · 也可以点星球自动飞</div>

<div id="labels"></div>
<div class="dock" id="dock"></div>
<div id="stick"><div class="knob"></div></div>
<button id="boost">加速</button>

<div id="station">
  <div class="st-head">
    <div class="big" id="stEmoji"></div>
    <div><h2 id="stTitle"></h2><p id="stDesc"></p></div>
    <div class="count" id="stCount"></div>
  </div>
  <div id="stBody"></div>
</div>

<div id="loading"><div class="box">
  <div class="rocket">🚀</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div style="opacity:.8">飞船点火中…</div>
</div></div>

<script src="assets/js/supabase.min.js"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script type="module" src="js/u/main.js"></script>
</body>
</html>
