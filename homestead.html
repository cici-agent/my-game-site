<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7bc950">
<title>菜鸟家园 · 小菜鸟宇宙</title>
<link rel="stylesheet" href="css/space.css">
<style>
  html, body { background: #bfe6ff; }
  .hud-top .brand { text-shadow: 0 2px 8px rgba(20,60,20,.45); }
  #devTag { position: fixed; top: calc(var(--top-h) + 4px); left: 50%; transform: translateX(-50%); z-index: 9;
    background: rgba(30,70,30,.7); color: #fff; padding: 8px 18px; border-radius: 999px; font-weight: 800; font-size: 14px; white-space: nowrap; }
  #takeoff { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 9; border: 0; border-radius: 18px;
    background: #FF6B35; color: #fff; font: 800 16px inherit; font-family: inherit; padding: 12px 26px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  #hint { position: fixed; left: 50%; top: calc(var(--top-h) + 48px); transform: translateX(-50%); z-index: 9; background: rgba(30,70,30,.55); color: #fff;
    padding: 8px 16px; border-radius: 999px; font-size: 13px; white-space: nowrap; transition: opacity .6s; }
  #hint.hide { opacity: 0; }
  body.touch #hint { display: none; }
  canvas#scene { cursor: grab; touch-action: none; } canvas#scene:active { cursor: grabbing; }
  body.touch #stick { display: block; bottom: 30px; }
  .round-btn { position: fixed; z-index: 9; width: 78px; height: 78px; border-radius: 50%; border: 0; color: #fff; font-weight: 900; font-size: 15px;
    font-family: inherit; display: none; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  body.touch .round-btn { display: block; }
  #jumpBtn { right: 22px; bottom: 30px; background: rgba(77,171,247,.9); }
  body.touch #takeoff { bottom: auto; top: calc(var(--top-h) + 52px); left: auto; right: 14px; transform: none; padding: 9px 16px; font-size: 14px; }
  #loading { position: fixed; inset: 0; z-index: 20; background: #bfe6ff; display: flex; align-items: center; justify-content: center;
    color: #2f5d2f; font-weight: 800; font-size: 18px; transition: opacity .5s; }
  #loading.hide { opacity: 0; pointer-events: none; }
  #prompt { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%) translateY(8px); z-index: 9; background: rgba(40,28,12,.82);
    border: 2px solid #ffd23f; color: #fff; padding: 8px 18px; border-radius: 16px; text-align: center; opacity: 0; pointer-events: none; transition: all .2s; max-width: 92vw; }
  #prompt.show { opacity: 1; transform: translateX(-50%); }
  #prompt b { display: block; font-size: 16px; } #prompt span { display: block; font-size: 13px; opacity: .9; margin-top: 2px; }
  #toast { position: fixed; left: 50%; top: calc(var(--top-h) + 92px); transform: translateX(-50%) translateY(-6px); z-index: 11; background: rgba(30,70,30,.9); color: #fff;
    padding: 10px 20px; border-radius: 999px; font-weight: 800; font-size: 15px; opacity: 0; transition: all .25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #bag { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); z-index: 9; display: flex; gap: 4px; padding: 5px; background: rgba(60,40,20,.55); border-radius: 12px; }
  #bag .slot { width: 40px; height: 40px; border-radius: 8px; background: rgba(255,255,255,.14); position: relative; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  #bag .slot i { position: absolute; right: 3px; bottom: 1px; font-style: normal; font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000; }
  #bag .slot em { position: absolute; left: 2px; top: 1px; font-style: normal; font-size: 9px; color: #ffe08a; font-weight: 800; }
  #bag .slot.seed { background: rgba(255,255,255,.1); }
  #bag .slot { cursor: pointer; border: 2px solid transparent; }
  #bag .slot.on { border-color: #ffd23f; background: rgba(255,210,63,.35); box-shadow: 0 0 10px rgba(255,210,63,.6); transform: translateY(-3px); }
  #bag .slot.tool { background: rgba(120,190,255,.25); }
  #bag .slot u { position: absolute; left: 3px; top: 0; text-decoration: none; font-size: 10px; font-weight: 800; color: rgba(255,255,255,.75); }
  #prompt.dim { border-color: rgba(255,255,255,.4); }
  /* 种子：牛皮纸小纸袋，上边是锯齿口，中间贴着菜的小图 */
  #bag .pk { width: 26px; height: 32px; position: relative; display: flex; align-items: center; justify-content: center; margin-top: 3px;
    background: linear-gradient(#e9d3a0, #d9b978); border-radius: 0 0 4px 4px; box-shadow: inset 0 -3px 0 rgba(120,80,30,.25), 0 1px 2px rgba(0,0,0,.3); }
  #bag .pk::before { content: ''; position: absolute; left: 0; right: 0; top: -4px; height: 5px;
    background: linear-gradient(135deg, transparent 50%, #e9d3a0 50%) 0 0 / 5px 5px repeat-x, linear-gradient(225deg, transparent 50%, #e9d3a0 50%) 0 0 / 5px 5px repeat-x; }
  #bag .pk b { width: 20px; height: 20px; border-radius: 50%; background: #fff8e6; font-size: 13px; display: flex; align-items: center; justify-content: center; border: 1px solid #c9a86a; }
  #bag .veg { font-size: 26px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  body.touch #bag .pk { width: 20px; height: 24px; } body.touch #bag .pk b { width: 15px; height: 15px; font-size: 10px; } body.touch #bag .veg { font-size: 20px; }
  #actBtn { right: 112px; bottom: 50px; background: rgba(255,107,53,.95); font-size: 14px; display: none !important; }
  body.touch #actBtn.show { display: block !important; }
  #pick { position: fixed; inset: 0; z-index: 15; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.25); }
  #pick.show { display: flex; }
  #pick .box { background: #fffaf0; color: #3b2a14; border: 3px solid #7bc950; border-radius: 22px; padding: 14px 16px; width: min(460px, 92vw); }
  #pick .hd { font-size: 20px; font-weight: 900; display: flex; align-items: center; margin-bottom: 10px; }
  #pick .hd button { margin-left: auto; border: 0; background: #eee; border-radius: 999px; width: 32px; height: 32px; font-size: 16px; cursor: pointer; }
  #pickList { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #pickList button { border: 2px solid #d9e8c8; background: #fff; border-radius: 14px; padding: 8px; text-align: left; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 800; color: #3b2a14; }
  #pickList button:hover:not(:disabled) { border-color: #7bc950; }
  #pickList button:disabled { opacity: .45; cursor: default; }
  #pickList b { display: inline-block; width: 18px; color: #7bc950; } #pickList .e { font-size: 20px; margin-right: 4px; }
  #pickList small { display: block; font-weight: 600; font-size: 11px; color: #8a7a60; margin-top: 2px; }
  #pick .tip { font-size: 12px; color: #8a7a60; margin-top: 8px; text-align: center; }
  #dbg { position: fixed; right: 12px; top: calc(var(--top-h) + 4px); z-index: 12; text-align: right; }
  #dbg > button { border: 0; background: rgba(60,40,120,.8); color: #fff; padding: 7px 12px; border-radius: 999px; font-weight: 800; cursor: pointer; font-family: inherit; }
  #dbg .body { display: none; margin-top: 6px; background: rgba(255,255,255,.95); color: #333; border-radius: 14px; padding: 10px; text-align: left; width: 250px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
  #dbg.open .body { display: block; }
  #dbg .t { font-size: 12px; color: #777; margin: 6px 0 4px; }
  #dbg .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  #dbg .row button { border: 1px solid #ccc; background: #fff; border-radius: 8px; padding: 4px 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  #dbg .row button.on { background: #7bc950; color: #fff; border-color: #7bc950; }
  body.touch #bag { bottom: 150px; } body.touch #bag .slot { width: 30px; height: 30px; font-size: 17px; }
  body.touch #prompt { bottom: 196px; }
  body.touch #dbg { top: calc(var(--top-h) + 100px); }
  #devTag { pointer-events: none; }
  #money { position: fixed; left: 16px; top: calc(var(--top-h) + 6px); z-index: 9; background: rgba(60,40,20,.7); color: #fff3d0; padding: 6px 14px; border-radius: 999px; font-size: 14px; }
  #money b { font-size: 17px; color: #ffd23f; }
  #shopUI { position: fixed; inset: 0; z-index: 15; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.3); }
  #shopUI.show { display: flex; }
  #shopUI .box { background: #fff7e8; color: #3b2a1a; border: 4px solid #e8473e; border-radius: 20px; padding: 14px 16px; width: min(560px, 94vw); max-height: 84vh; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  #shopUI .hd { font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
  #shopUI .hd .mo { margin-left: auto; font-size: 15px; font-weight: 700; background: #4a2e14; color: #fff3d0; padding: 4px 12px; border-radius: 999px; } #shopUI .hd .mo b { color: #ffd23f; }
  #shopUI .hd button { border: 0; background: #eee; border-radius: 999px; width: 32px; height: 32px; cursor: pointer; }
  #shopUI .tabs { display: flex; gap: 6px; margin: 10px 0; }
  #shopUI .tabs button { flex: 1; border: 2px solid #e8c9a6; background: #fff; border-radius: 12px; padding: 8px; font-family: inherit; font-weight: 800; font-size: 15px; cursor: pointer; color: #7a4a1c; }
  #shopUI .tabs button.on { background: #e8473e; border-color: #e8473e; color: #fff; }
  #shopList { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  #shopList .row { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #f0dcc0; border-radius: 12px; padding: 6px 8px; }
  #shopList .row.lock { opacity: .5; }
  #shopList .ic { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex: none; }
  #shopList .pk { width: 26px; height: 32px; display: flex; align-items: center; justify-content: center; background: linear-gradient(#e9d3a0, #d9b978); border-radius: 0 0 4px 4px; }
  #shopList .pk b { width: 20px; height: 20px; border-radius: 50%; background: #fff8e6; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  #shopList .nm { flex: 1; font-weight: 800; font-size: 15px; min-width: 0; } #shopList .nm small { display: block; font-weight: 500; font-size: 12px; color: #8a7a60; }
  #shopList .pr { font-weight: 800; color: #b45309; white-space: nowrap; }
  #shopList button { border: 0; background: #7bc950; color: #fff; font-weight: 800; border-radius: 10px; padding: 8px 10px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  #shopList button:disabled { background: #ccc; cursor: default; }
  #shopList .empty { text-align: center; color: #8a7a60; padding: 30px 0; }
  #shopUI .tip { font-size: 12px; color: #8a7a60; text-align: center; margin-top: 8px; }
  body.touch #money { top: calc(var(--top-h) + 52px); }
  #chestUI { position: fixed; inset: 0; z-index: 15; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.3); }
  #chestUI.show { display: flex; }
  #chestUI .box { background: #8a5a2e; border: 4px solid #5e3a1a; border-radius: 18px; padding: 12px 14px; color: #fff3dc; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  #chestUI .hd { font-size: 19px; font-weight: 900; display: flex; align-items: center; margin-bottom: 8px; }
  #chestUI .hd button { margin-left: auto; border: 0; background: rgba(255,255,255,.2); color: #fff; border-radius: 999px; width: 30px; height: 30px; cursor: pointer; }
  #chestUI .grid { display: grid; grid-template-columns: repeat(6, 46px); gap: 5px; }
  #chestUI .grid.bagrow { grid-template-columns: repeat(7, 46px); }
  #chestUI .t { margin: 10px 0 6px; font-weight: 800; font-size: 14px; }
  #chestUI .tip { font-size: 12px; opacity: .8; margin-top: 8px; text-align: center; }
  #chestUI .slot, .slot.ghost { width: 46px; height: 46px; border-radius: 9px; background: rgba(0,0,0,.22); position: relative; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; user-select: none; }
  #chestUI .slot i, .slot.ghost i { position: absolute; right: 3px; bottom: 1px; font-style: normal; font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000; }
  #chestUI .slot.lift { opacity: .35; }
  .slot.ghost { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) scale(1.1); display: none; background: rgba(255,210,63,.5); }
  .slot.ghost.show { display: flex; }
  #chestUI .pk, .slot.ghost .pk { width: 26px; height: 32px; position: relative; display: flex; align-items: center; justify-content: center; margin-top: 3px; background: linear-gradient(#e9d3a0, #d9b978); border-radius: 0 0 4px 4px; }
  #chestUI .pk b, .slot.ghost .pk b { width: 20px; height: 20px; border-radius: 50%; background: #fff8e6; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  #chestUI .veg, .slot.ghost .veg { font-size: 26px; }
  body.touch #chestUI .grid { grid-template-columns: repeat(6, 40px); } body.touch #chestUI .grid.bagrow { grid-template-columns: repeat(7, 40px); }
  body.touch #chestUI .slot { width: 40px; height: 40px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud-top">
  <div class="brand"><div class="dot">🐣</div>小菜鸟宇宙<span class="where">· 菜鸟家园</span></div>
</div>
<div id="devTag">🚧 建设中 · 只有管理员能看到</div>
<button id="takeoff">🚀 起飞</button>
<div id="hint">WASD / 方向键走路 · 空格跳 · Shift 跑 · 数字键选东西 · 走到田边按 E 使用 · 拖动屏幕转视角 · 滚轮缩放 · M 看全景地图</div>
<div id="prompt"></div>
<div id="toast"></div>
<div id="bag"></div>
<button class="round-btn" id="actBtn">操作</button>
<div id="chestUI"><div class="box">
  <div class="hd"><span id="chestTitle">📦 我的箱子</span><button id="chestClose">✕</button></div>
  <div id="chestGrid" class="grid"></div>
  <div class="t">🎒 背包</div>
  <div id="chestBag" class="grid bagrow"></div>
  <div class="tip">拖动格子把东西搬来搬去 · 点一下整格搬到另一边 · 按 E 或 Esc 关上</div>
</div></div>
<div id="money"></div>
<div id="shopUI"><div class="box">
  <div class="hd">🏪 菜鸟小卖部<span class="mo">🥕 <b id="shopMoney">0</b> 菜币</span><button id="shopClose">✕</button></div>
  <div class="tabs"><button data-t="buy">买东西</button><button data-t="sell">卖菜</button></div>
  <div id="shopList"></div>
  <div class="tip">菜币只能在菜鸟家园里用，不能换金币 · 按 E 或 Esc 离开</div>
</div></div>
<div id="dbg"><button id="dbgToggle">🧪 管理员测试</button><div class="body">
  <div class="t">菜园等级</div><div class="row" id="dbgLv"></div>
  <div class="t">生长速度（只影响你自己的测试）</div><div class="row" id="dbgSp"></div>
  <div class="row"><button id="dbgSeeds">🎁 送种子</button><button id="dbgTrees">🌳 送树苗</button><button id="dbgCandle">🕯 送蜡烛</button><button id="dbgMoney">🥕 送 100 菜币</button><button id="dbgReset">🗑 重置菜园</button></div>
</div></div>
<div id="stick"><div class="knob"></div></div>
<button class="round-btn" id="jumpBtn">跳</button>
<div id="loading"><div>🏡 正在降落到菜鸟家园…</div></div>

<script src="assets/js/supabase.min.js"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script type="module">
import { loadMe } from './js/u/data.js';
document.getElementById('takeoff').onclick = () => location.href = 'index.html?takeoff=homestead';
// 只有管理员能进；其他人送回宇宙（落在菜鸟家园，看到"正在开发中"）
const me = await loadMe().catch(() => null);
if (!me || me.profile.role !== 'admin') location.replace('index.html?land=homestead');
else { window.__ME = me; import('./js/h/main.js'); }
</script>
</body>
</html>
