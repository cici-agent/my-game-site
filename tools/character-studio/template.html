<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src data: blob:; worker-src blob:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f5f2e9"><title>角色动作试用 · 霍格沃茨人物工作室</title>
<style>
:root{color-scheme:light;--ink:#26332e;--muted:#58655a;--rule:#cbd0c2;--green:#354b3b;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:#f5f2e9}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #6f8866;outline-offset:2px}main{max-width:1270px;margin:auto;padding:clamp(18px,4vw,54px)}header,.bar,.foot,.views{display:flex;align-items:center}header{justify-content:space-between;gap:12px;margin-bottom:22px}h1,h2,h3,p{margin:0}h1,.character{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-weight:500}h1{font-size:clamp(31px,3.8vw,54px);letter-spacing:.045em}.bar{gap:9px}.select-file,.secondary,.set button,.views button,#tempo{min-height:39px;padding:7px 13px;border-radius:6px;border:1px solid var(--rule);background:transparent}.select-file{background:var(--green);color:white;border-color:var(--green);padding:10px 18px;font-weight:600}.bench{display:grid;grid-template-columns:minmax(0,1fr) 270px;border:1px solid var(--rule);border-radius:11px;overflow:hidden}.studio{position:relative;isolation:isolate;height:clamp(375px,68vh,700px);min-width:0;overflow:hidden;background:radial-gradient(ellipse at 50% 37%,#f8f6ec 3%,#e7e8db 65%,#d8decd)}#stage{display:block;width:100%;height:100%;touch-action:none}.hint,.notice{position:absolute;padding:6px 10px;border-radius:5px;font-size:12px}.hint{bottom:12px;left:12px;color:#536051;background:rgba(250,249,242,.85);pointer-events:none}.notice{top:12px;left:12px;right:12px;margin:auto;width:fit-content;max-width:95%;color:#334232;background:#f6f4eb;box-shadow:0 1px 9px #334a2724}.notice[data-error=true]{color:#833b26}.notice[hidden]{display:none}aside{background:#f8f7f0;border-left:1px solid var(--rule);padding:23px;display:flex;flex-direction:column;align-items:stretch;gap:22px}.title{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:9px}.character{font-size:clamp(25px,2.6vw,34px);line-height:1.2;overflow-wrap:anywhere}.credit{font-size:12px;color:var(--muted);margin-top:7px}.line{border-top:1px solid var(--rule);padding-top:20px}.set,.views,.row{display:flex;gap:4px}.set{border:1px solid var(--rule);padding:3px;border-radius:8px;background:#f0f0e7}.set button{flex:1;border:0;padding:6px;min-height:34px}.set button[aria-pressed=true],.views button[aria-pressed=true]{color:#fff;background:var(--green);border-color:var(--green)}.row{justify-content:space-between;align-items:center;margin-top:10px}.row select{padding:5px;min-height:34px}.views{flex-wrap:wrap}.views button{min-height:33px;padding:5px 9px;font-size:13px}aside .local{font-size:13px;line-height:1.65;color:var(--muted);margin-top:auto}#restore{margin-top:9px;background:none;border:0;color:var(--green);padding:2px 0;text-decoration:underline;text-underline-offset:3px}.foot{margin-top:12px;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}#file{display:none}@media(max-width:740px){main{padding:17px 10px}.bench{grid-template-columns:1fr}.studio{height:clamp(320px,53svh,500px)}aside{border-left:0;border-top:1px solid var(--rule);padding:15px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.line{padding-top:0;border:0}.local{align-self:end}.character{font-size:22px}.title{margin-bottom:5px}.foot{flex-wrap:wrap}.hint{font-size:11px;bottom:8px}.select-file{font-size:13px;padding:8px 10px}.row{flex-wrap:wrap}.row button{min-height:32px;padding:5px 9px}header{margin-bottom:12px}}
.links{display:flex;align-items:center;gap:19px;flex-wrap:wrap;margin-bottom:16px}.links a{font-size:14px;color:var(--green);text-decoration:underline;text-underline-offset:4px}.links a:focus-visible{outline:2px solid var(--green)}@media(max-width:740px){.links{gap:14px;margin-bottom:12px}.set{flex-wrap:wrap}.set button{min-width:2.7em}}
</style></head><body><main>
<nav class="links" aria-label="角色工作室"><a href="index.html">返回人物工作室</a><a href="student-kit.zip" download>下载角色动作包</a></nav>
<header><h1>试用角色动作</h1><button type="button" class="select-file" id="choose">选择本地角色</button><input type="file" accept=".vrm,.glb" id="file" aria-label="选择 VRM 1.0 模型"></header>
<div class="bench"><section class="studio" aria-label="角色预览"><canvas id="stage" aria-label="可旋转的三维角色"></canvas><p class="notice" id="status" role="status">正在载入示例…</p><span class="hint">拖动旋转 · 滚轮或双指缩放</span></section>
<aside><div><h2 class="title">当前角色</h2><p id="name" class="character">正在载入</p><p class="credit" id="credit"></p></div>
<div class="line"><h2 class="title">动作</h2><div class="set" role="group" aria-label="动作"><button data-motion="Idle" aria-pressed="false">站立</button><button data-motion="Walk" aria-pressed="true">走路</button><button data-motion="Run" aria-pressed="false">跑步</button><button data-motion="Cast" aria-pressed="false">施法</button></div>
<div class="row"><button class="secondary" id="pause" aria-pressed="false">暂停</button><select id="tempo" aria-label="播放速度"><option value="1">正常速度</option><option value=".5">半速</option></select></div></div>
<div class="line"><h2 class="title">视角</h2><div class="views" role="group" aria-label="视角"><button data-view="front" aria-pressed="false">正面</button><button data-view="angle" aria-pressed="true">侧前方</button><button data-view="side" aria-pressed="false">侧面</button></div></div>
<div class="local"><p>支持 VRM 1.0 人形模型。所选文件只在这台设备上读取。</p><button type="button" id="restore" disabled>恢复示例角色</button></div>
</aside></div><footer class="foot"><span id="footnote">示例模型 © 2022 pixiv Inc.</span></footer>
</main><!--ASSETS--><!--APP--></body></html>
