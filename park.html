<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3b2a8c">
<title>菜鸟星球 · 小菜鸟宇宙</title>
<link rel="stylesheet" href="css/space.css">
<style>
  html, body { background: #ffcf9e; }
  canvas#scene { cursor: grab; }
  canvas#scene:active { cursor: grabbing; }
  .hud-top .brand, .coin-hud { text-shadow: 0 2px 8px rgba(40,20,80,.5); }
  .hint { background: rgba(40,20,80,.45); }
  #prompt { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 30px); transform: translateX(-50%) translateY(10px); z-index: 9;
    background: rgba(26,20,70,.85); border: 2px solid #ffd23f; color: #fff; padding: 10px 20px; border-radius: 999px; font-weight: 800; font-size: 16px;
    opacity: 0; pointer-events: none; transition: all .2s; white-space: nowrap; }
  #prompt.show { opacity: 1; transform: translateX(-50%); }
  body.touch #prompt { bottom: calc(var(--dock-h) + 150px); }
  .round-btn { position: fixed; z-index: 9; width: 78px; height: 78px; border-radius: 50%; border: 0; color: #fff; font-weight: 900; font-size: 15px;
    font-family: inherit; display: none; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  body.touch .round-btn { display: block; }
  #jumpBtn { right: 22px; bottom: calc(var(--dock-h) + 30px); background: rgba(77,171,247,.9); }
  #actBtn { right: 112px; bottom: calc(var(--dock-h) + 50px); background: rgba(255,107,53,.95); display: none !important; }
  body.touch #actBtn.show { display: block !important; }
  body.touch #stick { display: block; bottom: calc(var(--dock-h) + 24px); }

  #shop { position: fixed; top: var(--top-h); bottom: calc(var(--dock-h) + 8px); left: 16px; right: 16px; z-index: 12;
    background: rgba(255,250,242,.97); color: #2d3436; border: 3px solid var(--c); border-radius: 26px; display: flex; flex-direction: column; overflow: hidden;
    opacity: 0; pointer-events: none; transform: scale(.95); transition: all .3s cubic-bezier(.2,.9,.3,1.2); user-select: text; -webkit-user-select: text; }
  #shop.show { opacity: 1; pointer-events: auto; transform: none; }
  .shop-head { display: flex; align-items: center; padding: 16px 22px; background: var(--c); color: #fff; }
  .shop-head h2 { font-size: 24px; }
  .shop-head .note { margin-left: 14px; opacity: .9; font-size: 13px; }
  .shop-head button { margin-left: auto; border: 0; background: rgba(255,255,255,.25); color: #fff; font-size: 15px; font-weight: 800; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-family: inherit; }
  #shopBody { overflow-y: auto; padding: 16px 22px 24px; touch-action: pan-y; }
  .shop-h { margin: 8px 0 12px; font-size: 16px; }
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .item { background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08); display: flex; flex-direction: column; gap: 4px; border: 2px solid transparent; }
  .item:hover { border-color: var(--c); }
  .item .ic { font-size: 46px; text-align: center; background: linear-gradient(135deg, #fff3e0, #ffe0f0); border-radius: 14px; padding: 10px 0; }
  .item .nm { font-weight: 900; font-size: 16px; margin-top: 4px; }
  .item .tag { align-self: flex-start; font-size: 11px; background: #eef0ff; color: #5a67d8; padding: 1px 8px; border-radius: 8px; font-weight: 700; }
  .item .ds { font-size: 12px; color: #636e72; }
  .item .pk { font-size: 12px; color: #2d3436; padding-left: 16px; }
  .item .buy { margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; font-weight: 900; color: #e67700; }
  .item .buy button { border: 0; background: var(--c); color: #fff; font-weight: 800; padding: 7px 14px; border-radius: 999px; font-family: inherit; cursor: pointer; }
  .item .buy button:disabled { background: #ced4da; cursor: default; }
  .ship-stage { position: relative; height: 300px; border-radius: 18px; overflow: hidden; margin-bottom: 16px; background: #0b0f26; }
  .stage-tip { position: absolute; left: 12px; top: 10px; color: #fff; opacity: .7; font-size: 12px; z-index: 1; pointer-events: none; }
  .av-stage { background: radial-gradient(circle at 50% 40%, #fff7ec, #ffd8b5); height: 320px; }
  .av-stage .stage-tip { color: #8a5a2b; }
  .item.on { background: #fff8e6; }
  .item .have { font-size: 12px; font-weight: 800; color: #2b8a3e; min-height: 16px; }
  .item .buy .own { color: #2b8a3e; font-size: 13px; }
  .item .buy button.ask { background: #e03131; animation: pulse .6s infinite alternate; }
  .item .buy button.off { background: #868e96; }
  @keyframes pulse { to { transform: scale(1.08); } }
  #props { position: fixed; right: 12px; top: calc(var(--top-h) + 40px); z-index: 9; display: none; grid-template-columns: repeat(2, 54px); gap: 7px; }
  #props.show { display: grid; }
  #props button { position: relative; width: 54px; height: 54px; border-radius: 15px; border: 2px solid #ffd23f; background: rgba(26,20,70,.8); color: #fff; cursor: pointer; font-family: inherit; padding: 0; }
  #props button .e { font-size: 26px; }
  #props button b { position: absolute; right: 4px; bottom: 1px; font-size: 12px; }
  #props button i { position: absolute; left: 5px; top: 1px; font-size: 11px; font-style: normal; opacity: .7; }
  #props button:active { transform: scale(.92); }
  @media (max-height: 560px) { #props { grid-template-columns: repeat(3, 46px); } #props button { width: 46px; height: 46px; } #props button .e { font-size: 22px; } }
  #fxBar { position: fixed; left: 50%; top: calc(var(--top-h) + 6px); transform: translateX(-50%); z-index: 9; display: flex; gap: 8px; pointer-events: none; }
  #fxBar span { background: rgba(26,20,70,.8); color: #fff; padding: 5px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; }
  #toast { position: fixed; left: 50%; top: 38%; transform: translate(-50%, 10px); z-index: 20; background: rgba(26,20,70,.92); color: #fff; padding: 12px 22px; border-radius: 18px;
    font-weight: 800; font-size: 16px; opacity: 0; pointer-events: none; transition: all .25s; text-align: center; max-width: 86vw; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .item.sel { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 35%, transparent); }
  @media (max-width: 640px) {
    .ship-stage { height: 190px !important; position: sticky; top: -16px; z-index: 3; box-shadow: 0 6px 12px rgba(0,0,0,.12); }
    #shop { left: 8px; right: 8px; } .shop-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .item .ic { font-size: 36px; } .shop-head .note { display: none; }
    #prompt { font-size: 14px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="flash" class="on" style="--c:#ffb84d"></div>

<div class="hud-top">
  <div class="brand"><div class="dot">🐣</div>小菜鸟宇宙<span class="where" id="where">· 菜鸟星球</span><button id="mute" title="声音">🔊</button></div>
  <div class="coin-hud">🪙 : <span id="coinNum">--</span></div>
</div>
<div class="hint" id="hint">WASD / 方向键走路 · 空格跳 · Shift 跑 · 数字键用道具 · 拖动屏幕转视角 · 走到设施和商店门口按 E</div>

<div id="prompt"></div>
<div id="props"></div>
<div id="fxBar"></div>
<div id="toast"></div>
<div class="dock" id="dock"></div>
<div id="stick"><div class="knob"></div></div>
<button class="round-btn" id="jumpBtn">跳</button>
<button class="round-btn" id="actBtn">乘坐</button>

<div id="shop">
  <div class="shop-head"><h2 id="shopTitle"></h2><span class="note">用金币购买 · 点卡片可以先看看</span><button id="shopClose">✕ 离开商店</button></div>
  <div id="shopBody"></div>
</div>

<div id="loading"><div class="box">
  <div class="rocket">🎡</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div style="opacity:.8">正在降落到菜鸟星球…</div>
</div></div>

<script src="assets/js/supabase.min.js"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script type="module" src="js/p/main.js"></script>
</body>
</html>
