<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3b2a8c">
<title>菜鸟星球 · 小菜鸟宇宙</title>
<link rel="stylesheet" href="css/space.css">
<style>
  html, body { background: #ffcf9e; }
  canvas#scene { cursor: grab; }
  canvas#scene:active { cursor: grabbing; }
  .hud-top .brand, .coin-hud { text-shadow: 0 2px 8px rgba(40,20,80,.5); }
  .hint { background: rgba(40,20,80,.45); }
  #prompt { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 30px); transform: translateX(-50%) translateY(10px); z-index: 9;
    background: rgba(26,20,70,.85); border: 2px solid #ffd23f; color: #fff; padding: 10px 20px; border-radius: 999px; font-weight: 800; font-size: 16px;
    opacity: 0; pointer-events: none; transition: all .2s; white-space: nowrap; }
  #prompt.show { opacity: 1; transform: translateX(-50%); }
  body.touch #prompt { bottom: calc(var(--dock-h) + 150px); }
  .round-btn { position: fixed; z-index: 9; width: 78px; height: 78px; border-radius: 50%; border: 0; color: #fff; font-weight: 900; font-size: 15px;
    font-family: inherit; display: none; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  body.touch .round-btn { display: block; }
  #jumpBtn { right: 22px; bottom: calc(var(--dock-h) + 30px); background: rgba(77,171,247,.9); }
  #actBtn { right: 112px; bottom: calc(var(--dock-h) + 50px); background: rgba(255,107,53,.95); display: none !important; }
  body.touch #actBtn.show { display: block !important; }
  body.touch #stick { display: block; bottom: calc(var(--dock-h) + 24px); }

  #shop { position: fixed; top: var(--top-h); bottom: calc(var(--dock-h) + 8px); left: 16px; right: 16px; z-index: 12;
    background: rgba(255,250,242,.97); color: #2d3436; border: 3px solid var(--c); border-radius: 26px; display: flex; flex-direction: column; overflow: hidden;
    opacity: 0; pointer-events: none; transform: scale(.95); transition: all .3s cubic-bezier(.2,.9,.3,1.2); user-select: text; -webkit-user-select: text; }
  #shop.show { opacity: 1; pointer-events: auto; transform: none; }
  .shop-head { display: flex; align-items: center; padding: 16px 22px; background: var(--c); color: #fff; }
  .shop-head h2 { font-size: 24px; }
  .shop-head .note { margin-left: 14px; opacity: .9; font-size: 13px; }
  .shop-head button { margin-left: auto; border: 0; background: rgba(255,255,255,.25); color: #fff; font-size: 15px; font-weight: 800; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-family: inherit; }
  #shopBody { overflow-y: auto; padding: 16px 22px 24px; touch-action: pan-y; }
  .shop-h { margin: 8px 0 12px; font-size: 16px; }
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .item { background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08); display: flex; flex-direction: column; gap: 4px; border: 2px solid transparent; }
  .item:hover { border-color: var(--c); }
  .item .ic { font-size: 46px; text-align: center; background: linear-gradient(135deg, #fff3e0, #ffe0f0); border-radius: 14px; padding: 10px 0; }
  .item .nm { font-weight: 900; font-size: 16px; margin-top: 4px; }
  .item .tag { align-self: flex-start; font-size: 11px; background: #eef0ff; color: #5a67d8; padding: 1px 8px; border-radius: 8px; font-weight: 700; }
  .item .ds { font-size: 12px; color: #636e72; }
  .item .pk { font-size: 12px; color: #2d3436; padding-left: 16px; }
  .item .buy { margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; font-weight: 900; color: #e67700; }
  .item .buy button { border: 0; background: var(--c); color: #fff; font-weight: 800; padding: 7px 14px; border-radius: 999px; font-family: inherit; cursor: pointer; }
  .item .buy button:disabled { background: #ced4da; cursor: default; }
  .ship-stage { position: relative; height: 300px; border-radius: 18px; overflow: hidden; margin-bottom: 16px; background: #0b0f26; }
  .stage-tip { position: absolute; left: 12px; top: 10px; color: #fff; opacity: .7; font-size: 12px; z-index: 1; pointer-events: none; }
  .av-stage { background: radial-gradient(circle at 50% 40%, #fff7ec, #ffd8b5); height: 320px; }
  .av-stage .stage-tip { color: #8a5a2b; }
  .item.on { background: #fff8e6; }
  .item .have { font-size: 12px; font-weight: 800; color: #2b8a3e; min-height: 16px; }
  .item .buy .own { color: #2b8a3e; font-size: 13px; }
  .item .buy button.ask { background: #e03131; animation: pulse .6s infinite alternate; }
  .item .buy button.off { background: #868e96; }
  @keyframes pulse { to { transform: scale(1.08); } }
  #bag { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--dock-h) + 14px); z-index: 9; display: none; gap: 6px;
    background: rgba(26,20,70,.55); padding: 6px; border-radius: 16px; }
  #bag.show { display: flex; }
  #bag .slot { position: relative; width: 54px; height: 54px; border-radius: 12px; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12);
    color: #fff; cursor: pointer; font-family: inherit; padding: 0; touch-action: manipulation; }
  #bag .slot .e { font-size: 28px; }
  #bag .slot b { position: absolute; right: 4px; bottom: 1px; font-size: 12px; text-shadow: 0 1px 2px #000; }
  #bag .slot i { position: absolute; left: 5px; top: 1px; font-size: 11px; font-style: normal; opacity: .75; }
  #bag .slot.sel { border-color: #ffd23f; background: rgba(255,210,63,.28); transform: translateY(-4px); box-shadow: 0 0 0 3px rgba(255,210,63,.35); }
  #bag .slot.on b { color: #8ce99a; }
  #bag .slot.empty { opacity: .55; }
  #bagName { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 84px); transform: translateX(-50%); z-index: 9; background: rgba(26,20,70,.85); color: #fff;
    padding: 5px 14px; border-radius: 999px; font-weight: 800; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  #bagName.show { opacity: 1; }
  #prompt { bottom: calc(var(--dock-h) + 120px) !important; } body.touch #prompt { bottom: calc(var(--dock-h) + 175px) !important; }
  @media (max-width: 640px) {
    #bag { gap: 3px; padding: 4px; bottom: calc(var(--dock-h) + 8px); } #bag .slot { width: 36px; height: 40px; border-radius: 9px; } #bag .slot .e { font-size: 20px; }
    #bag .slot i { font-size: 9px; } #bag .slot b { font-size: 10px; } #bagName { bottom: calc(var(--dock-h) + 58px); font-size: 12px; }
  }
  body.touch #stick { bottom: calc(var(--dock-h) + 70px) !important; }
  body.touch #jumpBtn { bottom: calc(var(--dock-h) + 70px); }
  body.touch #actBtn { bottom: calc(var(--dock-h) + 90px); }
  #ward { position: fixed; right: 12px; top: calc(var(--top-h) + 10px); z-index: 9; width: 214px; display: none; background: rgba(26,20,70,.72);
    border: 2px solid rgba(255,210,63,.6); border-radius: 18px; color: #fff; overflow: hidden; max-height: calc(100vh - var(--top-h) - var(--dock-h) - 120px); overflow-y: auto; }
  #ward.show { display: block; }
  #ward .w-head { width: 100%; text-align: left; border: 0; background: rgba(255,210,63,.18); color: #fff; font: 800 15px inherit; font-family: inherit; padding: 9px 14px; cursor: pointer; }
  #ward .w-head b { float: right; }
  #ward .w-body { padding: 8px 8px 10px; }
  #ward h5 { margin: 10px 4px 6px; font-size: 13px; } #ward h5 small { font-weight: 400; opacity: .7; font-size: 11px; }
  #ward .w-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #ward .w { border: 2px solid transparent; background: rgba(255,255,255,.12); border-radius: 12px; color: #fff; padding: 5px 2px 4px; cursor: pointer; font-family: inherit; }
  #ward .w span { display: block; font-size: 26px; line-height: 1.1; } #ward .w em { display: block; font-style: normal; font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ward .w.on { border-color: #ffd23f; background: rgba(255,210,63,.3); }
  #ward .w-tip { font-size: 12px; opacity: .8; margin: 8px 4px 2px; }
  @media (max-width: 640px) { #ward { width: 168px; right: 8px; } #ward .w span { font-size: 22px; } #ward .w em { font-size: 10px; } }
  #dnChip { position: fixed; left: 18px; top: calc(var(--top-h) + 4px); z-index: 9; background: rgba(26,20,70,.75); color: #fff; padding: 5px 12px; border-radius: 999px;
    font-weight: 800; font-size: 13px; pointer-events: none; }
  #dnChip b { color: #ffd43b; font-variant-numeric: tabular-nums; } #dnChip.hot b { color: #ff8bd8; }
  #dnBanner { position: fixed; left: 50%; top: calc(var(--top-h) + 46px); transform: translate(-50%, -8px); z-index: 19; background: linear-gradient(90deg, #7048e8, #f06595);
    color: #fff; padding: 12px 26px; border-radius: 18px; font-weight: 900; font-size: 20px; opacity: 0; transition: all .3s; pointer-events: none; text-align: center; max-width: 90vw;
    box-shadow: 0 8px 24px rgba(112,72,232,.45); }
  #dnBanner.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 640px) { #dnChip { font-size: 11px; left: 8px; } #dnBanner { font-size: 15px; padding: 9px 16px; } }
  #timeTest { position: fixed; left: 18px; top: calc(var(--top-h) + 34px); z-index: 11; display: none; }
  #timeTest.show { display: block; }
  #timeTest .tt-head { border: 0; background: #e03131; color: #fff; font: 800 12px inherit; font-family: inherit; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  #timeTest.shifted .tt-head::after { content: ' · 已跳时间'; }
  #timeTest .tt-body { display: none; margin-top: 6px; background: rgba(26,20,70,.92); border: 2px solid #e03131; border-radius: 14px; padding: 8px; width: 190px; }
  #timeTest.open .tt-body { display: block; }
  #timeTest .tt-body p { color: #ffc9c9; font-size: 11px; margin: 0 2px 6px; }
  #timeTest .tt-body button { display: block; width: 100%; margin: 4px 0; border: 0; border-radius: 10px; padding: 7px 10px; text-align: left; background: rgba(255,255,255,.12); color: #fff;
    font: 700 13px inherit; font-family: inherit; cursor: pointer; }
  #timeTest .tt-body button:hover { background: rgba(255,255,255,.25); }
  #timeTest .tt-body .tt-reset { background: #2b8a3e; }
  #timeTest h6 { color: #fff; font-size: 12px; margin: 6px 2px 2px; } #timeTest h6.all { margin-top: 12px; color: #ffd43b; }
  #timeTest .tt-body button.all { background: rgba(255,210,63,.25); }
  #timeTest .tt-body { max-height: calc(100vh - 160px); overflow-y: auto; }
  #kartHud { position: fixed; left: 50%; top: calc(var(--top-h) + 8px); transform: translateX(-50%); z-index: 12; display: none; background: rgba(26,20,70,.85);
    border: 2px solid #ffd43b; border-radius: 16px; color: #fff; padding: 6px 16px; text-align: center; pointer-events: none; }
  #kartHud.show { display: block; }
  #kartHud button { pointer-events: auto; margin-top: 4px; border: 0; background: #ff922b; color: #fff; font: 800 12px inherit; font-family: inherit; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
  #escBtn { position: fixed; right: 16px; top: calc(var(--top-h) + 8px); z-index: 12; display: none; border: 2px solid #ffc9c9; background: #c92a2a; color: #fff;
    font: 900 15px inherit; font-family: inherit; padding: 9px 16px; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  body.in-mansion #escBtn { display: block; }
  body.in-mansion #ward, body.in-mansion #dnChip, body.in-mansion #fxBar { display: none !important; }
  body.karting #bag, body.karting #bagName, body.karting #ward { display: none !important; }
  #kartHud .kh-lap { font-weight: 900; font-size: 16px; }
  #kartHud .kh-row { display: flex; gap: 14px; font-size: 13px; margin-top: 2px; } #kartHud b { color: #ffd43b; font-variant-numeric: tabular-nums; }
  #fxBar { position: fixed; left: 50%; top: calc(var(--top-h) + 6px); transform: translateX(-50%); z-index: 9; display: flex; gap: 8px; pointer-events: none; }
  #fxBar span { background: rgba(26,20,70,.8); color: #fff; padding: 5px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; }
  #toast { position: fixed; left: 50%; top: 38%; transform: translate(-50%, 10px); z-index: 20; background: rgba(26,20,70,.92); color: #fff; padding: 12px 22px; border-radius: 18px;
    font-weight: 800; font-size: 16px; opacity: 0; pointer-events: none; transition: all .25s; text-align: center; max-width: 86vw; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .item.sel { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 35%, transparent); }
  @media (max-width: 640px) {
    .ship-stage { height: 190px !important; position: sticky; top: -16px; z-index: 3; box-shadow: 0 6px 12px rgba(0,0,0,.12); }
    #shop { left: 8px; right: 8px; } .shop-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .item .ic { font-size: 36px; } .shop-head .note { display: none; }
    #prompt { font-size: 14px; }
  }
  /* NPC 聊天 */
  .npc-bubble { position: fixed; left: 0; top: 0; max-width: 220px; background: #fff; color: #1a1446; font-weight: 700; font-size: 13px; line-height: 1.35; padding: 7px 11px; border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,.25); pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 6; white-space: normal; }
  .npc-bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fff; }
  #npcChat { position: fixed; right: 16px; bottom: calc(var(--dock-h) + 24px); width: min(340px, calc(100vw - 32px)); z-index: 30; display: none; flex-direction: column;
    background: rgba(26,20,70,.94); border: 2px solid #ffd23f; border-radius: 18px; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.4); overflow: hidden; }
  #npcChat.show { display: flex; }
  #npcChat .hd { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; font-weight: 800; background: rgba(255,210,63,.15); }
  #npcChat .hd button { background: none; border: 0; color: #fff; font-size: 20px; cursor: pointer; }
  #npcLog { max-height: 220px; min-height: 90px; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  #npcLog .m { max-width: 85%; padding: 6px 10px; border-radius: 12px; line-height: 1.4; }
  #npcLog .npc { align-self: flex-start; background: #fff; color: #1a1446; }
  #npcLog .me { align-self: flex-end; background: #ffd23f; color: #1a1446; }
  #npcChat form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid rgba(255,255,255,.12); }
  #npcChat input { flex: 1; min-width: 0; border-radius: 12px; border: 0; padding: 9px 11px; font-size: 15px; }
  #npcChat form button { border: 0; border-radius: 12px; background: #ffd23f; color: #1a1446; font-weight: 800; padding: 0 14px; cursor: pointer; }
  #npcChat .quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 10px; }
  #npcChat .quick button { border: 0; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-size: 12px; padding: 5px 10px; cursor: pointer; }
  #stallHud { position: fixed; left: 50%; top: 74px; transform: translateX(-50%); z-index: 12; display: none; background: rgba(26,20,70,.9); color: #fff; font-weight: 800; font-size: 15px;
    padding: 10px 18px; border-radius: 16px; border: 2px solid #ffd23f; text-align: center; max-width: calc(100vw - 24px); }
  #stallHud.show { display: block; }
  #stallBar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.15); margin-top: 8px; overflow: hidden; display: none; }
  #stallBar i { display: block; height: 100%; background: linear-gradient(90deg, #69db7c, #ffd43b, #ff6b6b); width: 0; }
  #aimDot { position: fixed; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,0,0,.6); pointer-events: none; z-index: 11; display: none; }
  body.in-stall #aimDot.on { display: block; }
  body.in-stall #bag, body.in-stall #ward, body.in-stall .dock, body.in-stall #stick, body.in-stall #jumpBtn { display: none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }
</script>

<body>
<canvas id="scene"></canvas>
<div id="flash" class="on" style="--c:#ffb84d"></div>

<div class="hud-top">
  <div class="brand"><div class="dot">🐣</div>小菜鸟宇宙<span class="where" id="where">· 菜鸟星球</span><button id="mute" title="声音">🔊</button></div>
  <div class="hud-right"><button id="loginBtn" class="login-btn" hidden>🔑 登录</button><div class="coin-hud">🪙 : <span id="coinNum">--</span></div></div>
</div>
<div class="hint" id="hint">WASD / 方向键走路 · 空格跳 · Shift 跑 · 数字键选背包格子、再按一次使用 · 拖动屏幕转视角（往上拖可以抬头看天）· 走到设施和商店门口按 E</div>

<div id="prompt"></div>
<div id="stallHud"><div id="stallTxt"></div><div id="stallBar"><i></i></div></div>
<div id="aimDot"></div>
<div id="npcChat"><div class="hd"><span id="npcName">💬</span><button id="npcClose" title="关闭">×</button></div>
  <div id="npcLog"></div>
  <div class="quick"><button>你好</button><button>你在干嘛？</button><button>推荐玩什么？</button><button>烟花秀什么时候？</button><button>一起玩吧</button><button>讲个笑话</button></div>
  <form id="npcForm"><input id="npcInput" maxlength="60" placeholder="跟 TA 说点什么…" autocomplete="off"><button>发送</button></form></div>
<div id="bag"></div>
<div id="ward"></div>
<div id="bagName"></div>
<div id="mpTags"></div>
<div id="fxBar"></div>
<div id="toast"></div>
<div id="dnChip"></div>
<button id="escBtn">🚪 紧急退出</button>
<div id="kartHud"><div class="kh-lap" id="kartLap"></div><div class="kh-row"><span>⏱ <b id="kartTime">--</b></span><span>⭐ 最快 <b id="kartBest">--</b></span><span>🏎️ <b id="kartSpeed">0</b></span></div><button id="kartReset">↩ 回到赛道</button></div>
<div id="timeTest"></div>
<div id="dnBanner"></div>
<div class="dock" id="dock"></div>
<div id="stick"><div class="knob"></div></div>
<button class="round-btn" id="jumpBtn">跳</button>
<button class="round-btn" id="actBtn">乘坐</button>

<div id="shop">
  <div class="shop-head"><h2 id="shopTitle"></h2><span class="note">用金币购买 · 点卡片可以先看看</span><button id="shopClose">✕ 离开商店</button></div>
  <div id="shopBody"></div>
</div>

<div id="loading"><div class="box">
  <div class="rocket">🎡</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div style="opacity:.8">正在降落到菜鸟星球…</div>
</div></div>

<script src="assets/js/supabase.min.js"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script type="module" src="js/p/main.js"></script>
</body>
</html>
