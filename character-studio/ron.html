<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e7">
  <title>罗恩·韦斯莱 · 角色工作室</title>
  <link rel="stylesheet" href="hermione.css">
  <script type="importmap">{"imports":{"three":"../vendor/three-0.187.0/build/three.module.js","three/addons/":"../vendor/three-0.187.0/examples/jsm/"}}</script>
</head>
<body>
<main>
  <header>
    <div><a class="back" href="index.html">角色动作工作室</a><h1>罗恩<span>·</span>韦斯莱</h1></div>
    <nav class="motions" aria-label="选择动作">
      <a href="#run" data-mode="run">跑步</a>
      <a href="#cast" data-mode="cast">施法</a>
      <a href="#face" data-mode="face">面部特写</a>
    </nav>
  </header>
  <section class="card" aria-label="罗恩动画预览">
    <div class="stage">
      <canvas id="portrait" tabindex="0" aria-label="罗恩的三维模型，可拖动旋转，双指缩放"></canvas>
      <div class="stage-note"><span id="shot">侧面全身</span><i aria-hidden="true"></i><span id="stage-mode">跑步</span></div>
      <div id="status" role="status">正在载入罗恩…</div>
    </div>
    <div class="transport">
      <button type="button" id="play" disabled>暂停</button>
      <input id="timeline" type="range" min="0" max="1000" value="0" aria-label="动作进度" disabled>
      <label class="speed">速度<select id="speed" aria-label="播放速度"><option value="1">原速</option><option value=".5">半速</option></select></label>
    </div>
    <div class="tools"><span class="hint">拖动旋转 · 滚轮或双指缩放</span><label id="trace-control" hidden><input id="trace" type="checkbox">柳木杖轨迹</label><div class="views" role="group" aria-label="摄影视角">
      <span>视角</span><button type="button" data-angle="front">正面</button><button type="button" data-angle="quarter">侧前方</button><button type="button" data-angle="side">侧面</button>
    </div></div>
  </section>
  <footer><a href="ron-motion.mp4">观看动作短片</a><a href="../magic-academy.html?arrival=castle&amp;look=keeper">穿这套校服进城堡</a></footer>
</main>
<script type="module">
  import {openCharacterStudio} from './performer.mjs';
  openCharacterStudio({name:'罗恩', modelFile:'ron-weasley.glb', wandName:'Ron_Willow_Wand'});
</script>
</body>
</html>
